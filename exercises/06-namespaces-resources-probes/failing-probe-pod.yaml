apiVersion: v1
kind: Pod
metadata:
  name: failing-probe-pod
spec:
  containers:
  - name: app
    image: busybox
    command: ['sh', '-c', 'echo "Running..." && sleep 3600']
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
